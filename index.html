<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AllTrack — Mini App</title>
    <style>
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: #f3f6ff;
        color: #1a1f2e;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      a {
        color: #3b7dff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <p>
      Если переход не сработал, откройте
      <a href="./telegram-alltrack.html" data-redirect-link>AllTrack</a>.
    </p>
    <script>
      const targetUrl = new URL("./telegram-alltrack.html", window.location.href);
      targetUrl.search = window.location.search;
      targetUrl.hash = window.location.hash;

      const link = document.querySelector("[data-redirect-link]");
      if (link) {
        link.href = targetUrl.href;
      }

      window.location.replace(targetUrl.href);
    </script>
  </body>
</html>
