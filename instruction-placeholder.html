<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Инструкция скоро появится</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 12% 8%, rgba(59, 130, 246, .18), transparent 34%),
        radial-gradient(circle at 88% 12%, rgba(16, 185, 129, .14), transparent 30%),
        linear-gradient(180deg, #f8fafc, #eff6ff);
      color: #0f172a;
    }
    main {
      width: min(460px, 100%);
      padding: 24px;
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 28px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 24px 70px rgba(15, 23, 42, .12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }
    .icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(59, 130, 246, .16), rgba(16, 185, 129, .14));
      font-size: 34px;
    }
    h1 { margin: 0; font-size: clamp(24px, 7vw, 34px); line-height: 1.08; }
    p { margin: 10px 0 0; color: #64748b; font-size: 15px; font-weight: 750; line-height: 1.45; }
    .pill {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(239, 246, 255, .9);
      color: #2563eb;
      font-size: 13px;
      font-weight: 900;
    }
    button {
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      color: #fff;
      font-size: 15px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 16px 32px rgba(37, 99, 235, .22);
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📘</div>
    <h1>Инструкция скоро появится</h1>
    <p id="message">Файл пока не добавлен в папку инструкций.</p>
    <div class="pill" id="details">⏳ Ожидает загрузки</div>
    <button type="button" onclick="window.close(); history.back();">Закрыть</button>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get('title') || 'Инструкция';
    const type = params.get('type') === 'pdf' ? 'PDF' : 'Видео';
    document.title = `${title} — инструкция скоро появится`;
    document.getElementById('message').textContent = `Для раздела «${title}» ${type.toLowerCase()}-инструкция пока не добавлена.`;
    document.getElementById('details').textContent = `${type} · заглушка`;
  </script>
</body>
</html>
