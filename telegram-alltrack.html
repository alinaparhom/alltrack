      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #ffffff, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        height: 100dvh;
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        padding: 0;
        overflow: hidden;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      .screen {
        width: 100%;
        height: 100%;
        min-height: 0;
        flex: 1 1 auto;
        background: var(--glass);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 0;
        padding: calc(16px + env(safe-area-inset-top) + var(--telegram-top-spacing, 0px)) 16px
          calc(18px + env(safe-area-inset-bottom));
        box-shadow: var(--shadow);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      .app-scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding-bottom: calc(
          var(--quick-access-offset, 0px) + env(safe-area-inset-bottom)
        );
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      body.is-telegram {
        --telegram-top-spacing: var(--telegram-top-controls-offset, 0px);
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: -40% 40% auto auto;
        width: 160px;
        height: 160px;
        background: var(--accent-soft);
        filter: blur(0px);
        border-radius: 50%;
      }

      h1 {
        font-size: var(--text-xl);
        line-height: 1.2;
        margin-bottom: 12px;
      }

      p {
        font-size: var(--text-md);
        line-height: 1.6;
        color: var(--muted);
      }

      .app-header {
        display: grid;
        gap: 8px;
        margin-bottom: 8px;
        position: sticky;
        top: 0;
        z-index: 4;
        padding-bottom: 4px;
        backdrop-filter: blur(14px);
      }

      body.is-energy-role .app-header {
        margin-bottom: 0;
        padding-bottom: 0;
      }

      .app-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .pending-title {

      }

      .role-description {

      .role-grid {

      .role-card--org-choice {

      .org-choice-grid {

        gap: 10px;

      .org-choice-card {

        border: 1px solid rgba(59, 125, 255, 0.2);

        background: rgba(255, 255, 255, 0.82);

      .org-choice-card:hover {

      }

      .org-choice-title {
        font-size: var(--text-md);
        font-weight: 700;
        color: var(--text);
      }

      .org-choice-meta {

      }

      .is-hidden {

      }

      .dashboard {
        display: grid;
        gap: var(--space);
      }

      .dashboard-header {
        display: grid;
        gap: var(--space);
      }

      .dashboard-subtitle {
        font-size: 14px;
        color: var(--muted);
      }

      .dashboard-stats {
        display: grid;
        gap: var(--space);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tools-map-card {
        padding: 0;
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 16px 36px rgba(26, 31, 46, 0.08);
        display: grid;
        gap: 0;
        position: sticky;
        top: 12px;
        z-index: 3;
        backdrop-filter: blur(18px);
        overflow: hidden;
        flex-shrink: 0;
      }

      .tools-map-header {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: nowrap;
        cursor: pointer;
      }

      .tools-map-card--collapsed .tools-map-header {
        display: flex;
        min-height: var(--action-card-height);
        padding: 0 12px;
      }

      .tools-map-header-actions {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex: 1 1 auto;
      }

      .tools-map-collapsed-info {
        min-width: 0;
        width: 100%;
        min-height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px 8px 0;
        border-radius: 16px;
        border: none;
        background: rgba(255, 255, 255, 0.66);
        backdrop-filter: blur(12px);
      }

      .tools-map-collapsed-logo {
        width: clamp(36px, 9vw, 42px);
        height: clamp(36px, 9vw, 42px);
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: #ffffff;
        border: 1px solid rgba(148, 163, 184, 0.34);
        box-shadow: 0 6px 14px rgba(26, 31, 46, 0.14);
        color: #1e3a8a;
        font-size: clamp(16px, 4vw, 19px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.4px;
      }

      .tools-map-collapsed-site {
        font-size: clamp(17px, 4.1vw, 19px);
        font-weight: 800;
        color: var(--accent);
        line-height: 1.2;
      }

      .tools-map-collapsed-site strong {
        display: block;
        color: var(--accent);
        line-height: 1.1;
      }

      .tools-map-collapsed-caption {
        font-size: 12px;
        line-height: 1.25;
        color: var(--muted);
      }

      .tools-map-title {
        margin: 0;
        font-size: var(--text-lg);
        font-weight: 700;
        color: var(--text);
      }

      .tools-map-subtitle {
        margin: 6px 0 0;
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .tools-map-pill {
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(59, 125, 255, 0.14);
        color: var(--accent);
        font-size: var(--text-sm);
        font-weight: 700;
        white-space: nowrap;
      }

      .tools-map-toggle {
        appearance: none;
        border: 1px solid rgba(59, 125, 255, 0.24);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.74);
        color: var(--accent);
        width: 34px;
        height: 34px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .tools-map-toggle:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(26, 31, 46, 0.12);
      }

      .tools-map-toggle span {
        transition: transform 0.24s ease;
      }

      .tools-map-toggle--overlay.is-collapsed span {
        transform: rotate(-180deg);
      }

      .tools-map-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .tools-map-toggle--overlay {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 3;
        background: rgba(255, 255, 255, 0.86);
      }

      .tools-map-toggle--header {
        display: none;
        width: auto;
        min-width: 72px;
        padding: 0 14px;
        font-size: 13px;
      }

      .tools-map-header:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .tools-map-card--collapsed .tools-map-toggle--header {
        display: inline-flex;
      }

      .tools-map-card--collapsed .tools-map-toggle--overlay {
        display: none;
      }

      .tools-map-canvas {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        height: auto;
        border-radius: inherit;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(235, 242, 255, 0.75));
        border: 1px solid rgba(216, 227, 248, 0.9);
        overflow: hidden;
        cursor: pointer;
        touch-action: none;
        transform: translateZ(0);
        transition: transform 0.32s ease, box-shadow 0.32s ease, opacity 0.28s ease, max-height 0.32s ease, margin 0.32s ease;
      }

      .tools-map-canvas:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .tools-map-layer {
        position: absolute;
        inset: 0;
        transform-origin: center center;
        will-change: transform;
      }

      .tools-map-canvas--interactive {
        cursor: grab;
      }

      .tools-map-canvas--interactive-live {
        touch-action: pan-x pan-y;
      }

      .tools-map-canvas--interactive-live .tools-map-layer {
        transform: none !important;
      }

      .tools-map-canvas--interactive-live .leaflet-container {
        width: 100%;
        height: 100%;
        background: #eef3ff;
        font-family: inherit;
      }

      .tools-map-canvas--interactive:active {
        cursor: grabbing;
      }

      .tools-map-canvas--alive {
        animation: mapAwake 0.7s ease;
      }

      .tools-map-card--collapsed .tools-map-canvas,
      .tools-map-card--collapsed .tools-map-legend {
        max-height: 0;
        opacity: 0;
        margin-top: 0;
        pointer-events: none;
        border-width: 0;
      }

      .tools-map-canvas--map::before {
        opacity: 0;
      }

      .tools-map-canvas--map::after {
        display: none;
      }

      .tools-map-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: inherit;
        filter: none;
        transition: none;
      }

      .tools-map-canvas--alive .tools-map-image {
        filter: none;
      }

      body[data-theme="dark"] .tools-map-canvas {
        background: linear-gradient(
          145deg,
          rgba(22, 30, 50, 0.95),
          rgba(15, 20, 34, 0.8)
        );
        border-color: rgba(148, 170, 210, 0.3);
      }

      body[data-theme="dark"] .tools-map-collapsed-info {
        border: none;
        background: rgba(18, 30, 56, 0.6);
      }

      body[data-theme="dark"] .tools-map-collapsed-logo {
        border-color: rgba(148, 170, 210, 0.35);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      }

      body[data-theme="dark"] .tools-map-canvas::before {
        background-image: linear-gradient(
            to right,
            rgba(123, 178, 255, 0.18) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(123, 178, 255, 0.18) 1px,
            transparent 1px
          );
        opacity: 0.35;
      }

      body[data-theme="dark"] .tools-map-canvas--map::before {
        opacity: 0;
      }

      body[data-theme="dark"] .tools-map-canvas--map::after {
        display: none;
      }

      .tools-map-canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            to right,
            rgba(104, 130, 190, 0.12) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(104, 130, 190, 0.12) 1px,
            transparent 1px
          );
        background-size: 48px 48px;
        opacity: 0.6;
        pointer-events: none;
      }

      .tools-map-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        font-size: var(--text-md);
        color: var(--muted);
      }

      .tools-map-dot {
        appearance: none;
        -webkit-appearance: none;
        position: absolute;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 10px 6px 26px;
        border-radius: 999px;
        border: 1px solid rgba(59, 125, 255, 0.25);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.12);
        color: var(--text);
        font-size: 11px;
        font-weight: 600;
        font-family: inherit;
        line-height: 1.2;
        cursor: pointer;
        backdrop-filter: blur(12px);
        max-width: 75%;
      }

      body[data-theme="dark"] .tools-map-dot {
        color: #172033;
      }

      body[data-theme="dark"] .tools-map-dot__count {
        color: #1e40af;
      }

      .tools-map-dot:focus-visible {
        outline: 2px solid rgba(59, 125, 255, 0.55);
        outline-offset: 2px;
      }

      .tools-map-dot::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 0;
        transform: translateY(-50%);
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(59, 125, 255, 0.2);
      }

      .tools-map-dot::after {
        content: "";
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: rgba(59, 125, 255, 0.12);
        animation: mapPulse 2.6s ease-in-out infinite;
        z-index: -1;
      }

      .tools-map-dot__title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tools-map-dot__count {
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .tools-map-canvas--filtering .tools-map-dot,
      .tools-map-dot--filtered {
        width: 18px;
        height: 18px;
        min-width: 18px;
        padding: 0;
        border-radius: 999px;
        font-size: 0;
        color: transparent;
      }

      .tools-map-canvas--filtering .tools-map-dot::before,
      .tools-map-dot--filtered::before {
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .tools-map-canvas--filtering .tools-map-dot::after,
      .tools-map-dot--filtered::after {
        left: 50%;
        transform: translate(-50%, -50%);
      }

      @keyframes mapPulse {
        0% {
          transform: scale(0.6);
          opacity: 0.8;
        }
        70% {
          transform: scale(1.4);
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes mapAwake {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 rgba(59, 125, 255, 0);
        }
        35% {
          transform: scale(1.02);
          box-shadow: 0 18px 42px rgba(59, 125, 255, 0.16);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 rgba(59, 125, 255, 0);
        }
      }

      .tools-map-legend {
        display: grid;
        gap: 8px;
      }

      .tools-map-legend-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(226, 232, 240, 0.8);
        font-size: var(--text-sm);
        color: var(--text);
      }

      .tools-map-legend-item span {
        color: var(--muted);
        font-weight: 600;
      }

      @media (max-width: 420px) {
        .app-title-meta {
          font-size: 11px;

        .tools-map-header {
          align-items: center;
          gap: 8px;
        }

        .tools-map-title {
          font-size: 15px;

        .tools-map-pill {
          margin-left: auto;
          padding: 5px 10px;
          font-size: 12px;
        }

          top: 8px;
          right: 8px;
          width: 32px;
          height: 32px;

        .tools-map-canvas {
          width: 100%;
        }

      .stat-card {
        padding: var(--space);
        border-radius: var(--radius-card);

      .action-card {

    <script>
      (function lockViewportScale() {
        let lastTouchEndAt = 0;

        document.addEventListener(
          "gesturestart",
          (event) => {
            event.preventDefault();
          },
          { passive: false }
        );

        document.addEventListener(
          "gesturechange",
          (event) => {
            event.preventDefault();
          },
          { passive: false }
        );

        document.addEventListener(
          "gestureend",
          (event) => {
            event.preventDefault();
          },
          { passive: false }
        );

        document.addEventListener(
          "touchmove",
          (event) => {
            if (event.scale && event.scale !== 1) {
              event.preventDefault();
            }
          },
          { passive: false }
        );

        document.addEventListener(
          "touchend",
          (event) => {
            const currentTime = Date.now();
            if (currentTime - lastTouchEndAt <= 300) {
              event.preventDefault();
            }
            lastTouchEndAt = currentTime;
          },
          { passive: false }
        );
      })();

      (function () {
        const cacheBuster = Date.now().toString();
        window.ALLTRACK_CACHE_BUSTER = cacheBuster;

        const importMap = {
          imports: {
            "./app.js": `./app.js?v=${cacheBuster}`,
            "./roles/super-admin.js": `./roles/super-admin.js?v=${cacheBuster}`,
            "./roles/responsible.js": `./roles/responsible.js?v=${cacheBuster}`,
            "./roles/chief-engineer.js": `./roles/chief-engineer.js?v=${cacheBuster}`,
            "./roles/leader.js": `./roles/leader.js?v=${cacheBuster}`,
            "./roles/accounting.js": `./roles/accounting.js?v=${cacheBuster}`,
            "./roles/energy.js": `./roles/energy.js?v=${cacheBuster}`,
          },
        };

        const mapScript = document.createElement("script");
        mapScript.type = "importmap";
        mapScript.textContent = JSON.stringify(importMap);
        document.head.appendChild(mapScript);

        const appScript = document.createElement("script");
        appScript.type = "module";
        appScript.textContent = 'import "./app.js";';
        document.body.appendChild(appScript);
      })();
    </script>
