        --title-muted: #6b758c;
        --radius: 24px;
        --radius-card: 18px;
        --space: 16px;
        --shadow: 0 24px 60px rgba(26, 31, 46, 0.08);
        --text-xl: 24px;
        --text-lg: 16px;
        --text-md: 14px;
        --text-sm: 12px;

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #ffffff, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        height: 100dvh;
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        padding: 0;
        overflow: hidden;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      .screen {
        width: 100%;
        height: 100%;
        min-height: 0;
        flex: 1 1 auto;
        background: var(--glass);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 0;
        padding: calc(16px + env(safe-area-inset-top)) 16px
          calc(18px + env(safe-area-inset-bottom));
        box-shadow: var(--shadow);
        position: relative;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      body.is-telegram .screen {
        padding-top: calc(28px + 36px + env(safe-area-inset-top, 0px));
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: -40% 40% auto auto;
        width: 160px;
        height: 160px;
        background: var(--accent-soft);
        filter: blur(0px);
        border-radius: 50%;
      }

      h1 {
        font-size: var(--text-xl);
        line-height: 1.2;
        margin-bottom: 12px;
      }

      p {

        height: 40px;

      .app-stat {

        justify-content: center;

        height: 40px;

        background: transparent;
        box-shadow: none;
      }

      .app-stat .section-icon {

        height: 100%;

        background: transparent;

      .pending-stat {

        height: 40px;

        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 24px rgba(26, 31, 46, 0.08);
        color: var(--title-muted);
        flex-shrink: 0;
        cursor: pointer;
      }

      .pending-stat.is-waiting {
        border-color: rgba(59, 125, 255, 0.45);
        color: var(--accent);
        background: rgba(59, 125, 255, 0.1);
      }

      .pending-stat.is-ready {
        border-color: var(--success);
        color: var(--success);
        background: var(--success-soft);
      }

      .pending-icon {
        font-size: 18px;
      }

      .pending-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        box-shadow: 0 8px 16px rgba(59, 125, 255, 0.3);

      .app-user {

        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
      }

      .app-user-name {
        font-size: var(--text-md);
        font-weight: 600;
      }

      .app-user-org {
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .role-card {
        margin-top: 20px;
        display: grid;
        gap: 18px;
      }

      .role-header h1 {
        margin-top: 12px;
        font-size: var(--text-xl);
        line-height: 1.3;
      }

      .role-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: var(--text-sm);
        font-weight: 600;
      }

      .role-description {
        font-size: var(--text-md);
        line-height: 1.6;
        color: var(--muted);
      }

      .role-grid {
        display: grid;
        gap: 12px;
      }

      .is-hidden {
        display: none !important;
      }

      .dashboard {
        display: grid;
        gap: var(--space);
      }

      .dashboard-header {
        display: grid;
        gap: var(--space);
      }

      .dashboard-subtitle {
        font-size: 14px;
        color: var(--muted);
      }

      .dashboard-stats {
        display: grid;
        gap: var(--space);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat-card {
        padding: var(--space);
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
        display: grid;
        gap: 12px;
        min-height: 112px;
      }

      .stat-card--action {
        appearance: none;
        text-align: left;
        width: 100%;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .stat-card--action:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 34px rgba(26, 31, 46, 0.12);
      }

      .stat-card--action:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .stat-card-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .stat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .stat-icon,
      .action-icon,
      .section-icon {
        width: 36px;
        height: 36px;
        border-radius: 14px;
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;

      .stat-label {
        font-size: var(--text-sm);
        color: var(--title-muted);
        font-weight: 700;
      }

      .stat-value {
        font-size: var(--text-lg);
        font-weight: 600;
        color: var(--text);
      }

      .stat-pill {
        padding: 4px 10px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: var(--text-sm);
        font-weight: 600;
      }

      .stat-meta {
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .action-grid {
        display: grid;
        gap: var(--space);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .action-card {
        --drag-x: 0px;
        --drag-y: 0px;
        --drag-scale: 1;
        --hover-lift: 0px;
        text-align: left;
        padding: var(--space);
        border-radius: var(--radius-card);
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 72px;
        container-type: inline-size;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        will-change: transform;
        transform: translate3d(var(--drag-x), var(--drag-y), 0)
          translateY(var(--hover-lift))
          scale(var(--drag-scale));
      }

      .action-card:hover {
        --hover-lift: -2px;
        box-shadow: 0 16px 40px rgba(26, 31, 46, 0.12);
      }

      .action-card.is-selected {
        border-color: rgba(59, 125, 255, 0.6);
        background: rgba(59, 125, 255, 0.12);
        box-shadow: 0 12px 30px rgba(59, 125, 255, 0.18);
      }

      .action-card.is-dragging {
        --hover-lift: 0px;
        --drag-scale: 1.04;
        transition: transform 0.12s ease-out, box-shadow 0.2s ease;
        box-shadow: 0 18px 40px rgba(26, 31, 46, 0.16);
        cursor: grabbing;
        z-index: 2;

      .action-title {
        font-size: clamp(11px, 3.2vw, var(--text-md));
        font-weight: 700;
        color: var(--title-muted);
        line-height: 1.2;
        min-width: 0;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        text-wrap: balance;
        word-break: normal;
        overflow-wrap: normal;
        hyphens: none;
        max-width: 100%;
      }

      .action-title--fit {
        word-break: normal;
        overflow-wrap: normal;
        hyphens: none;
      }

      @container (max-width: 150px) {
        .action-title {
          font-size: clamp(10px, 3vw, 13px);
          line-height: 1.1;
        }
      }

      @media (max-width: 420px) {
        .action-card {
          padding: 12px;
          min-height: 68px;

        .action-title {
          font-size: clamp(11px, 3.8vw, 14px);
          line-height: 1.15;
        }
      }

      .energy-dashboard {
        gap: 18px;
      }

      .energy-grid {
        touch-action: pan-y;
        user-select: none;
      }

      .energy-grid [data-energy-item] {
        touch-action: pan-y;
      }

      .energy-group-toggle-card {
        border: 1px dashed rgba(59, 125, 255, 0.4);
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
      }

      .energy-group-toggle-card .action-icon {
        background: rgba(59, 125, 255, 0.2);
        color: var(--accent);
      }

      .energy-hint {
        font-size: var(--text-sm);
        color: var(--muted);
        line-height: 1.5;
      }

      .energy-group-panel {
        display: grid;
        gap: 12px;
        padding: 14px;
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
      }

      .energy-group-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .energy-group-count {
        width: 32px;
        height: 32px;
        border-radius: 12px;
        background: rgba(59, 125, 255, 0.16);
        color: var(--accent);
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .energy-group-text {
        font-size: var(--text-sm);
        color: var(--title-muted);
        font-weight: 600;
      }

      .energy-group-actions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }

      .action-secondary {
        border: 1px solid rgba(59, 125, 255, 0.25);
        background: rgba(255, 255, 255, 0.6);
        color: var(--title-muted);
        font-weight: 600;
        padding: 14px var(--space);
        border-radius: var(--radius-card);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .action-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 40px rgba(26, 31, 46, 0.12);
      }

      .energy-grid.is-dragging {
        touch-action: none;
        user-select: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .action-card {
          transition: none;
        }
      }

      .action-group {
        gap: 16px;
      }

      .group-icon-stack {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .group-icon {
        width: 30px;
        height: 30px;
        border-radius: 12px;
        background: rgba(59, 125, 255, 0.12);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .group-icon-more {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
      }

      .group-title {
        font-size: var(--text-md);
        font-weight: 700;
        color: var(--title-muted);
      }

      .group-subtitle {
        font-size: var(--text-sm);
        color: var(--muted);
        margin-top: 4px;
      }

      .section-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--title-muted);
        font-size: var(--text-sm);
        font-weight: 700;
        width: fit-content;
      }

      .action-primary {
        border: none;
        background: rgba(59, 125, 255, 0.16);
        color: var(--accent);
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px var(--space);
        border-radius: var(--radius-card);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .action-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 40px rgba(26, 31, 46, 0.12);
      }

      .action-primary:disabled,
      .action-secondary:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        box-shadow: none;
        transform: none;
      }

      .action-danger {
        border: 1px solid rgba(255, 99, 99, 0.35);
        background: rgba(255, 99, 99, 0.16);
        color: #d64545;
        font-weight: 600;
        padding: 12px 16px;
        border-radius: var(--radius-card);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .action-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(214, 69, 69, 0.2);
      }

      .form-card {
        padding: var(--space);
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 32px rgba(26, 31, 46, 0.08);
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }

      .form-field {
        display: grid;
        gap: 6px;
        position: relative;
      }

      .form-file-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .form-file-option {
        position: relative;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 0 12px 30px rgba(26, 31, 46, 0.08);
        overflow: hidden;
      }

      .form-file-button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 16px;
        border-radius: 16px;
        border: 1px solid rgba(226, 232, 240, 0.95);
        background: rgba(255, 255, 255, 0.9);
        color: var(--accent);
        font-weight: 600;
        font-size: var(--text-sm);
        text-align: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease,
          border-color 0.2s ease, background 0.2s ease;
      }

      .form-file-option.is-filled .form-file-button {
        border-color: rgba(44, 186, 103, 0.65);

        color: #1f8d52;
        box-shadow: 0 12px 24px rgba(44, 186, 103, 0.18);
      }

      .form-file-option:focus-within .form-file-button {
        border-color: rgba(59, 125, 255, 0.6);
        box-shadow: 0 0 0 3px rgba(59, 125, 255, 0.15);
      }

      .form-file-option--button {
        border: none;
        padding: 0;
        background: none;
        cursor: pointer;
      }

      .form-file-option--button .form-file-button {
        width: 100%;
      }

      .breakdown-tool-card {
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(226, 232, 240, 0.95);
        box-shadow: 0 12px 28px rgba(26, 31, 46, 0.08);
        display: grid;
        gap: 6px;
      }

      .breakdown-tool-title {
        font-weight: 700;
        color: var(--text);
        font-size: var(--text-lg);
      }

      .breakdown-tool-meta {
        font-size: var(--text-sm);
        color: var(--muted);
        line-height: 1.4;
      }

      .breakdown-photo-summary {
        margin-top: 8px;
        font-size: var(--text-sm);
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .breakdown-photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(86px, 1fr));
        gap: 10px;
        margin-top: 10px;
      }

      .breakdown-photo-item {
        position: relative;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(226, 232, 240, 0.92);
        box-shadow: 0 10px 26px rgba(26, 31, 46, 0.08);
        overflow: hidden;
      }

      .breakdown-photo-item img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        aspect-ratio: 1 / 1;
      }

      .breakdown-photo-remove {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        border: none;
        background: rgba(26, 31, 46, 0.6);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        cursor: pointer;
      }

      .breakdown-photo-remove:focus {
        outline: 2px solid rgba(59, 125, 255, 0.6);
        outline-offset: 2px;
      }

      .breakdown-form__body {
        overflow: visible;
        padding-bottom: 0;
        scroll-padding-bottom: 0;
      }

      .breakdown-form__body.settings-modal__body {
        overflow: visible;
        padding-right: 0;
      }

      .breakdown-form {
        display: block;
      }

      .breakdown-form.settings-modal__form {
        display: block;
        padding: 6px 14px 16px;
      }

      .breakdown-form__header {
        padding-right: 18px;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
      }

      .breakdown-form__close {
        position: static;
        margin-top: 0;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        align-self: center;
      }

      .breakdown-form textarea.form-input {
        direction: ltr;
        text-align: left;
        unicode-bidi: plaintext;
      }

      .breakdown-form__footer {

        margin-top: 12px;
        padding: 12px 0 calc(12px + env(safe-area-inset-bottom));

        background: transparent;
        display: grid;
        gap: 10px;

      .breakdown-form__actions {
        display: flex;
        gap: 10px;
        flex-wrap: nowrap;
      }

      .breakdown-form__actions .action-primary,
      .breakdown-form__actions .action-secondary {
        flex: 1 1 0;
        min-width: 0;
      }

      .breakdown-status__body {
        display: grid;
        gap: 16px;
      }

      .breakdown-status-actions {
        display: grid;
        gap: 10px;
      }

      .breakdown-status__footer .settings-modal__actions {
        justify-content: flex-end;
      }

      .form-label {
        font-size: var(--text-sm);
        color: var(--title-muted);
        font-weight: 600;
      }

      .form-field--required .form-label {
        font-weight: 700;
        color: #2d5eea;
        background: rgba(59, 125, 255, 0.12);

        padding: 3px 10px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        width: fit-content;
      }

      .form-field--required .form-label::after {
        content: "★";
        font-size: 0.75em;
        color: #3b7dff;

      .form-field--required .form-input {
        border-color: rgba(59, 125, 255, 0.45);
        background: rgba(59, 125, 255, 0.06);

        background: rgba(44, 186, 103, 0.1);
        box-shadow: 0 0 0 3px rgba(44, 186, 103, 0.12);

      .form-field.is-invalid .form-label {
        color: #d64545;

      .form-field.is-invalid .form-input {

        background: rgba(255, 99, 99, 0.08);
        box-shadow: 0 0 0 3px rgba(214, 69, 69, 0.15);
      }

      .form-input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(226, 232, 240, 0.95);
        background: rgba(255, 255, 255, 0.95);
        font-size: var(--text-md);
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .form-input--file {
        position: absolute;
        inset: 0;
        opacity: 0;

        text-transform: none;
        letter-spacing: normal;
      }

      .settings-mailing-field--full {
        grid-column: 1 / -1;
      }

      .settings-group-chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .settings-notifications {
        display: grid;
        gap: 10px;
      }

      .settings-notification-card {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-radius: 16px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      }

      .settings-notification-card__header {
        display: grid;
        gap: 6px;
        font-weight: 600;
        color: var(--text);
      }

      .settings-notification-card__title {
        align-items: center;
      }

      .settings-notification-card__photo {
        align-items: center;
        justify-content: flex-start;
        font-weight: 500;
      }

      .settings-notification-card__fields {
        display: grid;
        gap: 10px;
      }

      .settings-notification-field {
        display: grid;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .settings-notification-field--full {
        grid-column: 1 / -1;
      }

      .settings-day-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .settings-day-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        color: var(--title-muted);
      }

      .settings-day-chip input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      .settings-day-groups-grid {
        display: grid;
        gap: 8px;
      }

      .settings-day-groups {
        display: grid;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.65);
      }

      .settings-day-groups__title {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .settings-day-groups__list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .settings-group-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        color: var(--title-muted);
      }

      .settings-group-chip input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      .settings-telegram-groups {
        display: grid;
        gap: 10px;
      }

      .settings-telegram-group {
        display: grid;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05);
      }

      .settings-telegram-group__header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .settings-telegram-group__title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }

      .settings-telegram-group__id {
        font-size: 11px;
        color: var(--muted);
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
      }

      .settings-telegram-group__fields {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }

      .settings-telegram-field {
        display: grid;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .settings-telegram-field .form-input {
        font-size: 13px;
        font-weight: 500;
        text-transform: none;
        letter-spacing: normal;
      }

      .settings-empty-note {
        font-size: 12px;
        color: var(--muted);
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(148, 163, 184, 0.12);
      }

      .settings-fines {
        display: grid;
        gap: 10px;
      }

      .settings-fine-card {
        display: grid;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 16px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      }

      .settings-fine-card__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-weight: 600;
        color: var(--text);
      }

      .settings-fine-card__fields {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }

      .settings-fine-field {
        display: grid;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .settings-fine-field .form-input {
        font-size: 13px;
        font-weight: 500;
        text-transform: none;
        letter-spacing: normal;
      }

      .settings-inline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .settings-inline--compact {
        font-size: 12px;
        color: var(--muted);
      }

      @media (max-width: 520px) {
        .settings-modal__panel {
          border-radius: 0;
        }

        .settings-table__row {
          grid-template-columns: 1fr;
        }

        .settings-modal__header {
          padding-top: calc(72px + env(safe-area-inset-top));
        }

        .settings-modal__footer {
          flex-direction: column-reverse;
          align-items: stretch;
        }
      }

      .button-icon--back .button-icon-emoji {
        font-size: 20px;
        font-weight: 800;
        text-shadow:
          0 0 0 currentColor,
          0.6px 0 currentColor,
          -0.6px 0 currentColor;
      }

      .button-telegram {
        width: 100%;
      }

      .registration-links {
        display: grid;
        gap: 10px;
      }

      .registration-link-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
      }

      .button-icon {
        width: 44px;
        height: 44px;
        border-radius: 16px;
        border: 1px solid rgba(59, 125, 255, 0.2);
        background: rgba(255, 255, 255, 0.8);
        color: var(--accent);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button-icon:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(26, 31, 46, 0.08);
      }

      .button-icon:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      .button-icon-emoji {
        font-size: 18px;
      }

      .settings-header {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .settings-title {
        display: grid;
        gap: 6px;
      }

      .settings-section {
        display: grid;
        gap: 10px;
      }

      .settings-section-title {
        font-size: var(--text-md);
        font-weight: 700;
        color: var(--text);
      }

      .role-tile {
        padding: var(--space);
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
      }

      .role-tile h3 {
        font-size: var(--text-lg);
        margin-bottom: 6px;
      }

      .role-tile p {
        font-size: var(--text-md);
        color: var(--muted);
      }

      .role-user {
        font-size: var(--text-md);
        padding: 12px var(--space);
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.08);
        color: var(--text);
      }

      .role-user strong {
        color: var(--accent);
      }

      @media (max-width: 420px) {
        .screen {
          padding: calc(14px + env(safe-area-inset-top)) 12px
            calc(16px + env(safe-area-inset-bottom));
        }

        h1 {
          font-size: 22px;
        }
      }

      @media (max-width: 360px) {
        .action-grid,
        .dashboard-stats,
        .statistics-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" role="main">
      <header class="app-header">
        <div class="app-title-row">
          <div class="app-title">
            <button
              class="app-title-badge"
              type="button"
              data-user-settings-trigger
              aria-label="Открыть настройки профиля"
            >
              <span data-user-initials>AA</span>
            </button>
            <span class="app-title-text">AllTrack</span>
          </div>
          <div class="app-title-actions">
            <button
              class="button-icon button-icon--back is-hidden"
              type="button"
              data-settings-back-header
              aria-label="Назад"
            >
              <span class="button-icon-emoji" aria-hidden="true">←</span>
            </button>
            <button
              class="pending-stat is-hidden"
              type="button"
              data-energy-pending-stat
              data-energy-pending-wrapper
              aria-live="polite"
              title="По всем запросам ответ дан"
            >
              <span class="pending-icon" data-energy-pending-icon aria-hidden="true"
                >✅</span
              >
              <span class="pending-badge is-hidden" data-energy-pending-count>0</span>
            </button>
            <div class="app-stat is-hidden" data-super-admin-stat title="Статистика">
              <span class="section-icon" aria-hidden="true">📊</span>
            </div>
          </div>
        </div>
      </header>
      <div class="app-user is-hidden" data-app-user>
        <div class="app-user-name" data-user-name>Пользователь</div>
        <div class="app-user-org" data-user-org>Организация</div>
      </div>
      <div data-content></div>
    </main>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
      (function () {
        const cacheBuster = Date.now().toString();
        window.ALLTRACK_CACHE_BUSTER = cacheBuster;

        const importMap = {
          imports: {
            "./app.js": `./app.js?v=${cacheBuster}`,
            "./roles/super-admin.js": `./roles/super-admin.js?v=${cacheBuster}`,
            "./roles/responsible.js": `./roles/responsible.js?v=${cacheBuster}`,
            "./roles/chief-engineer.js": `./roles/chief-engineer.js?v=${cacheBuster}`,
            "./roles/leader.js": `./roles/leader.js?v=${cacheBuster}`,
            "./roles/accounting.js": `./roles/accounting.js?v=${cacheBuster}`,
            "./roles/energy.js": `./roles/energy.js?v=${cacheBuster}`,
          },
        };

        const mapScript = document.createElement("script");
        mapScript.type = "importmap";
        mapScript.textContent = JSON.stringify(importMap);
        document.head.appendChild(mapScript);

        const appScript = document.createElement("script");
        appScript.type = "module";
        appScript.textContent = 'import "./app.js";';
        document.body.appendChild(appScript);
      })();
    </script>
  </body>
</html>
