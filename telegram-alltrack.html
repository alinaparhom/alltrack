<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7ff" />
    <title>AllTrack — Mini App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6ff;
        --glass: rgba(255, 255, 255, 0.7);
        --accent: #3b7dff;
        --accent-soft: rgba(59, 125, 255, 0.18);
        --text: #1a1f2e;
        --muted: #5f6b85;
        --title-muted: #6b758c;
        --radius: 24px;
        --radius-card: 18px;
        --space: 16px;
        --shadow: 0 24px 60px rgba(26, 31, 46, 0.08);
        --text-xl: 24px;
        --text-lg: 16px;
        --text-md: 14px;
        --text-sm: 12px;
      }

      body[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0f1422;
        --glass: rgba(16, 22, 36, 0.78);
        --accent: #6aa5ff;
        --accent-soft: rgba(106, 165, 255, 0.2);
        --text: #f4f6ff;
        --muted: #9aa3b8;
        --title-muted: #c2cadb;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #ffffff, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .screen {
        width: min(420px, 100%);
        background: var(--glass);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: var(--radius);
        padding: 28px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
      }

      body.is-telegram .screen {
        padding-top: calc(28px + 36px + env(safe-area-inset-top, 0px));
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: -40% 40% auto auto;
        width: 160px;
        height: 160px;
        background: var(--accent-soft);
        filter: blur(0px);
        border-radius: 50%;
      }

      h1 {
        font-size: var(--text-xl);
        line-height: 1.2;
        margin-bottom: 12px;
      }

      p {
        font-size: var(--text-md);
        line-height: 1.6;
        color: var(--muted);
      }

      .app-header {
        display: grid;
        gap: 12px;
        margin-bottom: 20px;
      }

      .app-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .app-title-actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .app-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #2a3b5f;
      }

      .app-title-badge {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--accent);
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 24px rgba(26, 31, 46, 0.08);
        flex-shrink: 0;
      }

      button.app-title-badge {
        border: 1px solid rgba(226, 232, 240, 0.9);
        padding: 0;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button.app-title-badge:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(26, 31, 46, 0.12);
      }

      button.app-title-badge:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      body[data-icon-style="icon-only"] .action-card {
        justify-content: center;
        text-align: center;
      }

      body[data-icon-style="icon-only"] .action-card .action-title {
        display: none;
      }

      body[data-icon-style="icon-title-below"] .action-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
      }

      body[data-icon-style="icon-title-below"] .action-card .action-title {
        font-size: var(--text-sm);
        color: var(--title-muted);
      }

      body.is-energy-role .app-title-badge {
        width: 40px;
        height: 40px;
        font-size: clamp(20px, 4vw, 22px);
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      .app-stat {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: none;
        background: transparent;
        box-shadow: none;
      }

      .app-stat .section-icon {
        width: 100%;
        height: 100%;
        border-radius: 14px;
        background: transparent;
        color: var(--accent);
        font-size: 18px;
      }

      .pending-stat {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 24px rgba(26, 31, 46, 0.08);
        color: var(--title-muted);
        flex-shrink: 0;
      }

      .pending-stat.is-waiting {
        border-color: rgba(59, 125, 255, 0.45);
        color: var(--accent);
        background: rgba(59, 125, 255, 0.1);
      }

      .pending-icon {
        font-size: 16px;
      }

      .pending-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        box-shadow: 0 8px 16px rgba(59, 125, 255, 0.3);
        position: absolute;
        top: -4px;
        right: -4px;
      }

      .app-user {
        display: grid;
        gap: 4px;
        padding: 12px 14px;
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
      }

      .app-user-name {
        font-size: var(--text-md);
        font-weight: 600;
      }

      .app-user-org {
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .role-card {
        margin-top: 20px;
        display: grid;
        gap: 18px;
      }

      .role-header h1 {
        margin-top: 12px;
        font-size: var(--text-xl);
        line-height: 1.3;
      }

      .role-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: var(--text-sm);
        font-weight: 600;
      }

      .role-description {
        font-size: var(--text-md);
        line-height: 1.6;
        color: var(--muted);
      }

      .role-grid {
        display: grid;
        gap: 12px;
      }

      .is-hidden {
        display: none !important;
      }

      .dashboard {
        display: grid;
        gap: var(--space);
      }

      .dashboard-header {
        display: grid;
        gap: var(--space);
      }

      .dashboard-subtitle {
        font-size: 14px;
        color: var(--muted);
      }

      .dashboard-stats {
        display: grid;
        gap: var(--space);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat-card {
        padding: var(--space);
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
        display: grid;
        gap: 12px;
        min-height: 112px;
      }

      .stat-card-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .stat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .stat-icon,
      .action-icon,
      .section-icon {
        width: 36px;
        height: 36px;
        border-radius: 14px;
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }

      .stat-label {
        font-size: var(--text-sm);
        color: var(--title-muted);
        font-weight: 700;
      }

      .stat-value {
        font-size: var(--text-lg);
        font-weight: 600;
        color: var(--text);
      }

      .stat-pill {
        padding: 4px 10px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: var(--text-sm);
        font-weight: 600;
      }

      .stat-meta {
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .action-grid {
        display: grid;
        gap: var(--space);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .action-card {
        --drag-x: 0px;
        --drag-y: 0px;
        --drag-scale: 1;
        --hover-lift: 0px;
        text-align: left;
        padding: var(--space);
        border-radius: var(--radius-card);
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 72px;
        container-type: inline-size;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        will-change: transform;
        transform: translate3d(var(--drag-x), var(--drag-y), 0)
          translateY(var(--hover-lift))
          scale(var(--drag-scale));
      }

      .action-card:hover {
        --hover-lift: -2px;
        box-shadow: 0 16px 40px rgba(26, 31, 46, 0.12);
      }

      .action-card.is-selected {
        border-color: rgba(59, 125, 255, 0.6);
        background: rgba(59, 125, 255, 0.12);
        box-shadow: 0 12px 30px rgba(59, 125, 255, 0.18);
      }

      .action-card.is-dragging {
        --hover-lift: 0px;
        --drag-scale: 1.04;
        transition: transform 0.12s ease-out, box-shadow 0.2s ease;
        box-shadow: 0 18px 40px rgba(26, 31, 46, 0.16);
        cursor: grabbing;
        z-index: 2;
      }

      .action-title {
        font-size: clamp(11px, 3.2vw, var(--text-md));
        font-weight: 700;
        color: var(--title-muted);
        line-height: 1.2;
        min-width: 0;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        text-wrap: balance;
        word-break: normal;
        overflow-wrap: normal;
        hyphens: none;
        max-width: 100%;
      }

      .action-title--fit {
        word-break: normal;
        overflow-wrap: normal;
        hyphens: none;
      }

      @container (max-width: 150px) {
        .action-title {
          font-size: clamp(10px, 3vw, 13px);
          line-height: 1.1;
        }
      }

      @media (max-width: 420px) {
        .action-card {
          padding: 12px;
          min-height: 68px;
        }

        .action-title {
          font-size: clamp(11px, 3.8vw, 14px);
          line-height: 1.15;
        }
      }

      .energy-dashboard {
        gap: 18px;
      }

      .energy-grid {
        touch-action: none;
        user-select: none;
      }

      .energy-grid [data-energy-item] {
        touch-action: none;
      }

      .energy-group-toggle-card {
        border: 1px dashed rgba(59, 125, 255, 0.4);
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
      }

      .energy-group-toggle-card .action-icon {
        background: rgba(59, 125, 255, 0.2);
        color: var(--accent);
      }

      .energy-hint {
        font-size: var(--text-sm);
        color: var(--muted);
        line-height: 1.5;
      }

      .energy-group-panel {
        display: grid;
        gap: 12px;
        padding: 14px;
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
      }

      .energy-group-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .energy-group-count {
        width: 32px;
        height: 32px;
        border-radius: 12px;
        background: rgba(59, 125, 255, 0.16);
        color: var(--accent);
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .energy-group-text {
        font-size: var(--text-sm);
        color: var(--title-muted);
        font-weight: 600;
      }

      .energy-group-actions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }

      .action-secondary {
        border: 1px solid rgba(59, 125, 255, 0.25);
        background: rgba(255, 255, 255, 0.6);
        color: var(--title-muted);
        font-weight: 600;
        padding: 14px var(--space);
        border-radius: var(--radius-card);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .action-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 40px rgba(26, 31, 46, 0.12);
      }

      .energy-grid.is-dragging {
        touch-action: none;
        user-select: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .action-card {
          transition: none;
        }
      }

      .action-group {
        gap: 16px;
      }

      .group-icon-stack {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .group-icon {
        width: 30px;
        height: 30px;
        border-radius: 12px;
        background: rgba(59, 125, 255, 0.12);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .group-icon-more {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
      }

      .group-title {
        font-size: var(--text-md);
        font-weight: 700;
        color: var(--title-muted);
      }

      .group-subtitle {
        font-size: var(--text-sm);
        color: var(--muted);
        margin-top: 4px;
      }

      .section-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--title-muted);
        font-size: var(--text-sm);
        font-weight: 700;
        width: fit-content;
      }

      .action-primary {
        border: none;
        background: rgba(59, 125, 255, 0.16);
        color: var(--accent);
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px var(--space);
        border-radius: var(--radius-card);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .action-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 40px rgba(26, 31, 46, 0.12);
      }

      .action-primary:disabled,
      .action-secondary:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        box-shadow: none;
        transform: none;
      }

      .form-card {
        padding: var(--space);
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 32px rgba(26, 31, 46, 0.08);
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }

      .form-field {
        display: grid;
        gap: 6px;
      }

      .form-label {
        font-size: var(--text-sm);
        color: var(--title-muted);
        font-weight: 600;
      }

      .form-input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(226, 232, 240, 0.95);
        background: rgba(255, 255, 255, 0.95);
        font-size: var(--text-md);
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .form-input:focus {
        outline: none;
        border-color: rgba(59, 125, 255, 0.6);
        box-shadow: 0 0 0 3px rgba(59, 125, 255, 0.15);
      }

      .form-hint {
        font-size: var(--text-sm);
        color: var(--muted);
        line-height: 1.5;
      }

      .form-actions {
        display: grid;
        gap: 10px;
      }

      .button-secondary {
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.7);
        color: var(--title-muted);
        font-weight: 600;
        padding: 14px var(--space);
        border-radius: var(--radius-card);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(26, 31, 46, 0.08);
      }

      .form-message {
        font-size: var(--text-sm);
        color: var(--accent);
        min-height: 18px;
      }

      .registration-box {
        padding: 16px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.08);
        border: 1px solid rgba(59, 125, 255, 0.2);
        display: grid;
        gap: 10px;
      }

      .registration-title {
        font-size: var(--text-md);
        font-weight: 700;
        color: var(--text);
      }

      .registration-hint {
        font-size: var(--text-sm);
        color: var(--muted);
        line-height: 1.5;
      }

      .registration-note {
        font-size: var(--text-sm);
        color: #2a3b5f;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 14px;
        padding: 10px 12px;
        border: 1px solid rgba(226, 232, 240, 0.8);
      }

      .registration-steps {
        list-style: none;
        display: grid;
        gap: 8px;
        padding: 0;
        margin: 0;
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .registration-steps li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(226, 232, 240, 0.7);
      }

      .registration-steps strong {
        color: var(--accent);
        font-weight: 700;
      }

      .registration-actions {
        display: grid;
        gap: 10px;
      }

      .registration-buttons {
        display: grid;
        gap: 10px;
      }

      .toggle-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 6px;
        border-radius: 16px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.7);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      }

      .toggle-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .toggle-option {
        flex: 1 1 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: var(--text-sm);
        font-weight: 600;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.72);
        cursor: pointer;
        transition: 0.2s ease;
        border: 1px solid transparent;
      }

      .toggle-input:focus-visible + .toggle-option {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .toggle-input:checked + .toggle-option {
        color: var(--text);
        background: rgba(59, 125, 255, 0.16);
        border-color: rgba(59, 125, 255, 0.3);
        box-shadow: 0 10px 20px rgba(59, 125, 255, 0.2);
      }

      .button-telegram {
        width: 100%;
      }

      .registration-links {
        display: grid;
        gap: 10px;
      }

      .registration-link-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
      }

      .button-icon {
        width: 44px;
        height: 44px;
        border-radius: 16px;
        border: 1px solid rgba(59, 125, 255, 0.2);
        background: rgba(255, 255, 255, 0.8);
        color: var(--accent);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button-icon:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(26, 31, 46, 0.08);
      }

      .button-icon:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      .button-icon-emoji {
        font-size: 18px;
      }

      .settings-header {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .settings-title {
        display: grid;
        gap: 6px;
      }

      .settings-profile {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px;
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 12px 30px rgba(26, 31, 46, 0.08);
      }

      body[data-theme="dark"] .settings-profile {
        background: rgba(16, 22, 36, 0.85);
        border-color: rgba(46, 56, 76, 0.9);
      }

      .settings-avatar {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: rgba(59, 125, 255, 0.14);
        color: var(--accent);
        display: grid;
        place-items: center;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        flex-shrink: 0;
      }

      .settings-name {
        font-size: var(--text-lg);
        font-weight: 700;
        color: var(--text);
      }

      .settings-org {
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .settings-section {
        display: grid;
        gap: 10px;
      }

      .settings-section-title {
        font-size: var(--text-md);
        font-weight: 700;
        color: var(--text);
      }

      .role-tile {
        padding: var(--space);
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
      }

      .role-tile h3 {
        font-size: var(--text-lg);
        margin-bottom: 6px;
      }

      .role-tile p {
        font-size: var(--text-md);
        color: var(--muted);
      }

      .role-user {
        font-size: var(--text-md);
        padding: 12px var(--space);
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.08);
        color: var(--text);
      }

      .role-user strong {
        color: var(--accent);
      }

      @media (max-width: 420px) {
        .screen {
          padding: 22px;
        }

        h1 {
          font-size: 22px;
        }
      }

      @media (max-width: 360px) {
        .action-grid,
        .dashboard-stats,
        .statistics-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" role="main">
      <header class="app-header">
        <div class="app-title-row">
          <div class="app-title">
            <button
              class="app-title-badge"
              type="button"
              data-user-settings-trigger
              aria-label="Открыть настройки профиля"
            >
              <span data-user-initials>AA</span>
            </button>
            <span class="app-title-text">AllTrack</span>
          </div>
          <div class="app-title-actions">
            <div
              class="pending-stat is-hidden"
              data-energy-pending-stat
              aria-live="polite"
              title="Перемещения, ожидающие ответа"
            >
              <span class="pending-icon" data-energy-pending-icon aria-hidden="true">✅</span>
              <span class="pending-badge is-hidden" data-energy-pending-count>0</span>
            </div>
            <div class="app-stat is-hidden" data-super-admin-stat title="Статистика">
              <span class="section-icon" aria-hidden="true">📊</span>
            </div>
          </div>
        </div>
      </header>
      <div class="app-user is-hidden" data-app-user>
        <div class="app-user-name" data-user-name>Пользователь</div>
        <div class="app-user-org" data-user-org>Организация</div>
      </div>
      <div data-content></div>
    </main>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        const cacheBuster = Date.now().toString();
        window.ALLTRACK_CACHE_BUSTER = cacheBuster;

        const importMap = {
          imports: {
            "./app.js": `./app.js?v=${cacheBuster}`,
            "./roles/super-admin.js": `./roles/super-admin.js?v=${cacheBuster}`,
            "./roles/responsible.js": `./roles/responsible.js?v=${cacheBuster}`,
            "./roles/chief-engineer.js": `./roles/chief-engineer.js?v=${cacheBuster}`,
            "./roles/leader.js": `./roles/leader.js?v=${cacheBuster}`,
            "./roles/accounting.js": `./roles/accounting.js?v=${cacheBuster}`,
            "./roles/energy.js": `./roles/energy.js?v=${cacheBuster}`,
          },
        };

        const mapScript = document.createElement("script");
        mapScript.type = "importmap";
        mapScript.textContent = JSON.stringify(importMap);
        document.head.appendChild(mapScript);

        const appScript = document.createElement("script");
        appScript.type = "module";
        appScript.textContent = 'import "./app.js";';
        document.body.appendChild(appScript);
      })();
    </script>
  </body>
</html>
