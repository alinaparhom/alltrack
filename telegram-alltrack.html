      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #ffffff, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        height: 100dvh;
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        padding: 0;
        overflow: hidden;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      .screen {
        width: 100%;
        height: 100%;
        min-height: 0;
        flex: 1 1 auto;
        background: var(--glass);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 0;
        padding: calc(16px + env(safe-area-inset-top) + var(--telegram-top-spacing, 0px)) 16px
          calc(18px + env(safe-area-inset-bottom));
        box-shadow: var(--shadow);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      .app-scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding-bottom: calc(
          var(--quick-access-offset, 0px) + env(safe-area-inset-bottom)
        );
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
      }

      body.is-telegram {
        --telegram-top-spacing: var(--telegram-top-controls-offset, 0px);
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: -40% 40% auto auto;
        width: 160px;
        height: 160px;
        background: var(--accent-soft);
        filter: blur(0px);
        border-radius: 50%;
      }

      h1 {
        font-size: var(--text-xl);
        line-height: 1.2;
        margin-bottom: 12px;
      }

      p {
        font-size: var(--text-md);
        line-height: 1.6;
        color: var(--muted);
      }

      .app-header {
        display: grid;
        gap: 8px;
        margin-bottom: 8px;
        position: sticky;
        top: 0;
        z-index: 4;
        padding-bottom: 4px;
        backdrop-filter: blur(14px);
      }

      body.is-energy-role .app-header {
        margin-bottom: 0;
        padding-bottom: 0;
      }

      .app-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .app-title-actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
        min-width: 0;
      }

      .app-title-actions.is-hidden {
        display: none;
      }

      .app-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 12px;
        color: var(--text);
        min-width: 0;
        flex: 1 1 auto;
      }

      .app-title-user {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .app-title-text {
        text-transform: none;
        letter-spacing: 0.2px;
        font-size: clamp(16px, 4.2vw, 20px);
        line-height: 1.2;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .app-title-meta {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
        text-transform: none;
        color: var(--muted);
        white-space: nowrap;
      }

      .app-title-position {
        font-size: 11px;
        line-height: 1.3;
        color: var(--muted);
        text-transform: none;
        letter-spacing: 0.1px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .app-title-badge {
        position: relative;
        overflow: hidden;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--accent);
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 24px rgba(26, 31, 46, 0.08);
        flex-shrink: 0;
      }

      .app-title-badge img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .app-title-badge[data-has-photo="true"] [data-user-initials] {
        opacity: 0;
      }

      button.app-title-badge {
        border: 1px solid rgba(226, 232, 240, 0.9);
        padding: 0;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button.app-title-badge:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(26, 31, 46, 0.12);
      }

      button.app-title-badge:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      body[data-icon-style="icon-only"] .action-card {
        justify-content: center;
        text-align: center;
      }

      body[data-icon-style="icon-only"] .action-card .action-title {
        display: none;
      }

      body[data-icon-style="icon-title-below"] .action-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
      }

      body[data-icon-style="icon-title-below"] .action-card .action-title {
        font-size: var(--text-sm);
        color: var(--title-muted);
      }

      body.is-energy-role .app-title-badge {
        width: 40px;
        height: 40px;
        font-size: clamp(20px, 4vw, 22px);
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      .app-stat {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: none;
        background: transparent;
        box-shadow: none;
      }

      .app-stat .section-icon {
        width: 100%;
        height: 100%;
        border-radius: 14px;
        background: transparent;
        color: var(--accent);
        font-size: 18px;
      }

      .pending-stat {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        min-width: 144px;
        height: 44px;
        padding: 6px 12px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 24px rgba(26, 31, 46, 0.08);
        color: var(--title-muted);
        flex-shrink: 0;
        cursor: pointer;
      }

      .pending-stat--grid {
        width: 100%;
        min-width: 0;
        height: auto;
        min-height: 72px;
        padding: var(--space);
        border-radius: var(--radius-card);
      }

      .pending-stat--grid .pending-info {
        min-width: 0;
      }

      .pending-stat--grid .pending-title {
        font-size: var(--text-md);
      }

      .pending-stat--grid .pending-status {
        font-size: var(--text-sm);
      }

      .pending-stat.is-waiting {
        border-color: rgba(59, 125, 255, 0.45);
        color: var(--accent);
        background: rgba(59, 125, 255, 0.1);
      }

      .pending-stat.is-ready {
        border-color: var(--success);
        color: var(--success);
        background: var(--success-soft);
      }

      .pending-icon {
        font-size: 18px;
      }

      .pending-info {
        display: grid;
        gap: 2px;
        text-align: left;
      }

      .pending-title {
        font-size: var(--text-sm);
        font-weight: 700;
        color: var(--text);
      }

      .pending-status {
        font-size: 11px;
        color: var(--muted);
      }

      .pending-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        box-shadow: 0 8px 16px rgba(59, 125, 255, 0.3);
        position: absolute;
        top: -4px;
        right: -4px;
      }

      .app-user {
        display: grid;
        gap: 4px;
        padding: 12px 14px;
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.06);
      }

      .app-user-name {
        font-size: var(--text-md);
        font-weight: 600;
      }

      .app-user-position {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        max-width: 100%;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid rgba(59, 125, 255, 0.24);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .app-user-org {
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .role-card {
        margin-top: 12px;
        display: grid;
        gap: 18px;
      }

      body.is-energy-role .role-card {
        margin-top: 0;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      .role-header h1 {
        margin-top: 12px;
        font-size: var(--text-xl);
        line-height: 1.3;
      }

      .role-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: var(--text-sm);
        font-weight: 600;
      }

      .role-description {
        font-size: var(--text-md);
        line-height: 1.6;
        color: var(--muted);
      }

      .role-grid {
        display: grid;
        gap: 12px;
      }

      .role-card--org-choice {
        gap: 14px;
      }

      .org-choice-grid {
        display: grid;
        gap: 10px;
      }

      .org-choice-card {
        width: 100%;
        border: 1px solid rgba(59, 125, 255, 0.2);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.08);
        padding: 12px 14px;
        display: grid;
        gap: 4px;
        text-align: left;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }

      .org-choice-card:active {
        transform: scale(0.99);
      }

      .org-choice-card:hover {
        border-color: rgba(59, 125, 255, 0.42);
        box-shadow: 0 14px 26px rgba(59, 125, 255, 0.16);
      }

      .org-choice-title {
        font-size: var(--text-md);
        font-weight: 700;
        color: var(--text);
      }

      .org-choice-meta {
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .is-hidden {
        display: none !important;
      }

      .dashboard {
        display: grid;
        gap: var(--space);
      }

      .dashboard-header {
        display: grid;
        gap: var(--space);
      }

      .dashboard-subtitle {
        font-size: 14px;
        color: var(--muted);
      }

      .dashboard-stats {
        display: grid;
        gap: var(--space);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tools-map-card {
        padding: 0;
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 16px 36px rgba(26, 31, 46, 0.08);
        display: grid;
        gap: 0;
        position: sticky;

    <main class="screen" role="main">
      <header class="app-header">
        <div class="app-title-row">
          <div class="app-title">
            <button
              class="app-title-badge"
              type="button"
              data-user-settings-trigger
              aria-label="Открыть настройки профиля"
            >
              <img src="" alt="Фото профиля" data-user-photo class="is-hidden" />
              <span data-user-initials>AA</span>
            </button>
            <div class="app-title-user">
              <span class="app-title-text" data-app-title-text>AllTrack</span>
              <span class="app-title-position" data-app-title-position>Должность не указана</span>
            </div>
          </div>
          <div class="app-title-actions">
            <button
              class="button-icon button-icon--back is-hidden"
              type="button"
              data-settings-back-header
              aria-label="Назад"
            >
              <span class="button-icon-emoji" aria-hidden="true">←</span>
            </button>
            <button
              class="pending-stat is-hidden"
              type="button"
              data-energy-pending-stat
              data-energy-pending-wrapper
              aria-live="polite"
              title="По всем запросам ответ дан"
            >
              <span class="pending-icon" data-energy-pending-icon aria-hidden="true"
                >✅</span
              >
              <span class="pending-info">
                <span class="pending-title">Перемещения</span>
                <span class="pending-status" data-energy-pending-status>
                  Все приняты
                </span>
              </span>
              <span class="pending-badge is-hidden" data-energy-pending-count>0</span>
            </button>
            <div class="app-stat is-hidden" data-super-admin-stat title="Статистика">
              <span class="section-icon" aria-hidden="true">📊</span>
            </div>
            <span class="app-title-meta is-hidden" data-app-title-meta aria-live="polite"></span>
          </div>
        </div>
      </header>
      <div class="app-user is-hidden" data-app-user>
        <div class="app-user-org" data-user-org>Организация</div>
      </div>
      <div class="app-scroll">
        <div data-content></div>
      </div>
    </main>

    <div class="global-loading" data-global-loading aria-hidden="true">
      <div class="global-loading__box" role="status" aria-live="polite" aria-label="Загрузка данных">
        <div class="global-loading__spinner" aria-hidden="true">⏳</div>
        <p>Загружаем данные…</p>
      </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
      (function lockViewportScale() {
        let lastTouchEndAt = 0;

        document.addEventListener(
          "gesturestart",
          (event) => {
            event.preventDefault();
          },
          { passive: false }
        );

        document.addEventListener(
          "gesturechange",
          (event) => {
            event.preventDefault();
          },
          { passive: false }
        );

        document.addEventListener(
          "gestureend",
          (event) => {
            event.preventDefault();
          },
          { passive: false }
        );

        document.addEventListener(
          "touchmove",
          (event) => {
            if (event.scale && event.scale !== 1) {
              event.preventDefault();
            }
          },
          { passive: false }
        );

        document.addEventListener(
          "touchend",
          (event) => {
            const currentTime = Date.now();
            if (currentTime - lastTouchEndAt <= 300) {
              event.preventDefault();
            }
            lastTouchEndAt = currentTime;
          },
          { passive: false }
        );
      })();

      (function () {
        const cacheBuster = Date.now().toString();
        window.ALLTRACK_CACHE_BUSTER = cacheBuster;

        const importMap = {
          imports: {
            "./app.js": `./app.js?v=${cacheBuster}`,
            "./roles/super-admin.js": `./roles/super-admin.js?v=${cacheBuster}`,
            "./roles/responsible.js": `./roles/responsible.js?v=${cacheBuster}`,
            "./roles/chief-engineer.js": `./roles/chief-engineer.js?v=${cacheBuster}`,
            "./roles/leader.js": `./roles/leader.js?v=${cacheBuster}`,
            "./roles/accounting.js": `./roles/accounting.js?v=${cacheBuster}`,
            "./roles/energy.js": `./roles/energy.js?v=${cacheBuster}`,
          },
        };

        const mapScript = document.createElement("script");
        mapScript.type = "importmap";
        mapScript.textContent = JSON.stringify(importMap);
        document.head.appendChild(mapScript);

        const appScript = document.createElement("script");
        appScript.type = "module";
        appScript.textContent = 'import "./app.js";';
        document.body.appendChild(appScript);
      })();
    </script>
  </body>
</html>
