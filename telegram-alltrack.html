<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7ff" />
    <title>AllTrack — Mini App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6ff;
        --glass: rgba(255, 255, 255, 0.7);
        --accent: #3b7dff;
        --accent-soft: rgba(59, 125, 255, 0.18);
        --text: #1a1f2e;
        --muted: #5f6b85;
        --radius: 24px;
        --shadow: 0 24px 60px rgba(26, 31, 46, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #ffffff, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .screen {
        width: min(420px, 100%);
        background: var(--glass);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: var(--radius);
        padding: 28px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: -40% 40% auto auto;
        width: 160px;
        height: 160px;
        background: var(--accent-soft);
        filter: blur(0px);
        border-radius: 50%;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        background: rgba(59, 125, 255, 0.12);
        padding: 6px 12px;
        border-radius: 999px;
        margin-bottom: 18px;
      }

      h1 {
        font-size: 26px;
        line-height: 1.2;
        margin-bottom: 12px;
      }

      p {
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      .role-card {
        margin-top: 20px;
        display: grid;
        gap: 18px;
      }

      .role-header h1 {
        margin-top: 12px;
        font-size: 24px;
        line-height: 1.3;
      }

      .role-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
      }

      .role-description {
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
      }

      .role-grid {
        display: grid;
        gap: 12px;
      }

      .dashboard {
        display: grid;
        gap: 20px;
      }

      .dashboard-header {
        display: grid;
        gap: 10px;
      }

      .dashboard-subtitle {
        font-size: 14px;
        color: var(--muted);
      }

      .dashboard-stats {
        display: grid;
        gap: 12px;
      }

      .stat-card {
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 30px rgba(26, 31, 46, 0.08);
        display: grid;
        gap: 8px;
      }

      .stat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .stat-label {
        font-size: 13px;
        color: var(--muted);
      }

      .stat-value {
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
      }

      .stat-pill {
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
      }

      .stat-meta {
        font-size: 13px;
        color: var(--muted);
      }

      .progress {
        height: 8px;
        border-radius: 999px;
        background: rgba(59, 125, 255, 0.12);
        overflow: hidden;
      }

      .progress span {
        display: block;
        height: 100%;
        width: 64%;
        background: var(--accent);
        border-radius: 999px;
      }

      .action-grid {
        display: grid;
        gap: 12px;
      }

      .action-card {
        text-align: left;
        padding: 16px;
        border-radius: 18px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 12px 30px rgba(26, 31, 46, 0.08);
        display: grid;
        gap: 8px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .action-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 40px rgba(26, 31, 46, 0.12);
      }

      .action-title {
        font-size: 15px;
        font-weight: 600;
      }

      .action-description {
        font-size: 13px;
        color: var(--muted);
      }

      .action-note {
        font-size: 12px;
        color: var(--muted);
      }

      .role-tile {
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 10px 30px rgba(26, 31, 46, 0.08);
      }

      .role-tile h3 {
        font-size: 16px;
        margin-bottom: 6px;
      }

      .role-tile p {
        font-size: 14px;
        color: var(--muted);
      }

      .role-user {
        font-size: 14px;
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(59, 125, 255, 0.08);
        color: var(--text);
      }

      .role-user strong {
        color: var(--accent);
      }

      @media (max-width: 420px) {
        .screen {
          padding: 22px;
        }

        h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" role="main">
      <div class="badge">Mini App · AllTrack</div>
      <div class="status" data-status>Загрузка...</div>
      <div data-content></div>
    </main>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
