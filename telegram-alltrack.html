<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7ff" />
    <title>AllTrack — Mini App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6ff;
        --glass: rgba(255, 255, 255, 0.7);
        --accent: #3b7dff;
        --accent-soft: rgba(59, 125, 255, 0.18);
        --text: #1a1f2e;
        --muted: #5f6b85;
        --muted-strong: #7a8396;
        --radius: 24px;
        --radius-card: 18px;
        --space: 16px;
        --shadow: 0 24px 60px rgba(26, 31, 46, 0.08);
        --text-xxl: 26px;
        --text-xl: 20px;
        --text-lg: 16px;
        --text-md: 14px;
        --text-sm: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #ffffff, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .screen {
        width: min(420px, 100%);
        background: var(--glass);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: var(--radius);
        padding: 28px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: -40% 40% auto auto;
        width: 160px;
        height: 160px;
        background: var(--accent-soft);
        filter: blur(0px);
        border-radius: 50%;
      }

      h1 {
        font-size: var(--text-xxl);
        line-height: 1.2;
        margin-bottom: 12px;
      }

      p {
        font-size: var(--text-md);
        line-height: 1.6;
        color: var(--muted);
      }

      .app-header {
        display: grid;
        gap: 10px;
        margin-bottom: 20px;
      }

      .app-title {
        font-size: var(--text-xl);
        font-weight: 700;
        letter-spacing: 0.6px;
        background: linear-gradient(120deg, #1a1f2e, #3b7dff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
      }

      .app-user {
        display: grid;
        gap: 4px;
        padding: 12px 14px;
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.08);
      }

      .app-user-name {
        font-size: var(--text-md);
        font-weight: 600;
      }

      .app-user-org {
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .role-card {
        margin-top: 20px;
        display: grid;
        gap: 18px;
      }

      .role-header h1 {
        margin-top: 12px;
        font-size: var(--text-xxl);
        line-height: 1.3;
      }

      .role-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: var(--text-sm);
        font-weight: 600;
      }

      .role-description {
        font-size: var(--text-md);
        line-height: 1.6;
        color: var(--muted);
      }

      .role-grid {
        display: grid;
        gap: 12px;
      }

      .dashboard {
        display: grid;
        gap: var(--space);
      }

      .dashboard-header {
        display: grid;
        gap: var(--space);
      }

      .dashboard-subtitle {
        font-size: var(--text-md);
        color: var(--muted);
      }

      .dashboard-stats {
        display: grid;
        gap: var(--space);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat-card {
        padding: var(--space);
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(226, 232, 240, 0.85);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.08);
        display: grid;
        gap: 12px;
        min-height: 112px;
      }

      .stat-card-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .stat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .stat-icon,
      .action-icon,
      .section-icon {
        width: 36px;
        height: 36px;
        border-radius: 14px;
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }

      .stat-label {
        font-size: var(--text-sm);
        font-weight: 700;
        color: var(--muted-strong);
      }

      .stat-value {
        font-size: var(--text-lg);
        font-weight: 600;
        color: var(--text);
      }

      .stat-pill {
        padding: 4px 10px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--accent);
        font-size: var(--text-sm);
        font-weight: 600;
      }

      .stat-meta {
        font-size: var(--text-sm);
        color: var(--muted);
      }

      .action-grid {
        display: grid;
        gap: var(--space);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .action-card {
        text-align: left;
        padding: var(--space);
        border-radius: var(--radius-card);
        border: 1px solid rgba(226, 232, 240, 0.85);
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.08);
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 72px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .action-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 40px rgba(26, 31, 46, 0.12);
      }

      .action-title {
        font-size: var(--text-md);
        font-weight: 700;
        color: var(--muted-strong);
      }

      .section-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.12);
        color: var(--muted-strong);
        font-size: var(--text-sm);
        font-weight: 700;
        width: fit-content;
      }

      .action-primary {
        border: none;
        background: rgba(59, 125, 255, 0.16);
        color: var(--accent);
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px var(--space);
        border-radius: var(--radius-card);
        box-shadow: 0 10px 24px rgba(26, 31, 46, 0.08);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .action-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 40px rgba(26, 31, 46, 0.12);
      }

      .role-tile {
        padding: var(--space);
        border-radius: var(--radius-card);
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 10px 30px rgba(26, 31, 46, 0.08);
      }

      .role-tile h3 {
        font-size: var(--text-lg);
        margin-bottom: 6px;
      }

      .role-tile p {
        font-size: var(--text-md);
        color: var(--muted);
      }

      .role-user {
        font-size: var(--text-md);
        padding: 12px var(--space);
        border-radius: var(--radius-card);
        background: rgba(59, 125, 255, 0.08);
        color: var(--text);
      }

      .role-user strong {
        color: var(--accent);
      }

      @media (max-width: 420px) {
        .screen {
          padding: 22px;
        }

        h1 {
          font-size: 22px;
        }
      }

      @media (max-width: 360px) {
        .action-grid,
        .dashboard-stats,
        .statistics-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" role="main">
      <header class="app-header">
        <div class="app-title">AllTrack</div>
        <div class="app-user">
          <div class="app-user-name" data-user-name>Загрузка...</div>
          <div class="app-user-org" data-user-org>Организация</div>
        </div>
      </header>
      <div data-content></div>
    </main>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
